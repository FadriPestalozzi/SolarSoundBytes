# PostgreSQL Performance Configuration for Read-Heavy Social Media Data
# Add these settings to your postgresql.conf file

# Memory Configuration (adjust based on your available RAM)
# For a system with 8GB+ RAM, use these values:
shared_buffers = 2GB                    # 25% of total RAM
effective_cache_size = 6GB              # 75% of total RAM  
work_mem = 256MB                        # Per-operation memory
maintenance_work_mem = 1GB              # For CREATE INDEX, VACUUM, etc.

# Read Performance Optimizations
random_page_cost = 1.1                  # SSDs have low random access cost
seq_page_cost = 1.0                     # Sequential reads baseline
effective_io_concurrency = 200          # For SSDs

# Query Planning
default_statistics_target = 100         # Better query plans with more stats
constraint_exclusion = partition        # Enable partition pruning

# Checkpointing (less important for read-heavy workloads)
checkpoint_completion_target = 0.9
wal_buffers = 16MB
checkpoint_timeout = 30min

# Connection and Resource Management
max_connections = 100                   # Adjust based on your needs
shared_preload_libraries = 'pg_stat_statements'

# Logging for Performance Monitoring
log_min_duration_statement = 1000       # Log queries > 1 second
log_statement = 'none'                  # Don't log all statements
log_checkpoints = on
log_connections = on
log_disconnections = on

# Auto-vacuum (important for maintaining performance)
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 20s

# Parallel Query Processing
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_worker_processes = 8
parallel_tuple_cost = 0.1
parallel_setup_cost = 1000.0

# Extensions needed for our schema
# Run these in your database:
# CREATE EXTENSION IF NOT EXISTS pg_trgm;        -- For text similarity/search
# CREATE EXTENSION IF NOT EXISTS pg_stat_statements; -- For query monitoring 